[project]
name = "credit-score-classification"
version = "0.1.0"
description = "Utilities for the credit-score-classification project"
authors = [
    {name = "Fernando Corcuera",email = "188613791+FerCorcuera@users.noreply.github.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas (>=3.0.3,<4.0.0)",
    "numpy (>=2.4.5,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "xgboost (>=3.2.0,<4.0.0)",
    "matplotlib (>=3.10.9,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "jupyter (>=1.1.1,<2.0.0)"
]
